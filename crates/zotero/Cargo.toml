[package]
name = "wordcraft-zotero"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft Zotero integration: Zotero's word-processor wire protocol, answered against an engine Session"

[lints]
workspace = true

[features]
default = ["font-download", "ssip"]
font-download = ["wordcraft-engine/font-download"]
ssip = ["wordcraft-engine/ssip"]

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-formats = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
wordcraft-docx = { workspace = true }
proptest = { workspace = true }
