[package]
name = "wordcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[[bin]]
name = "wordcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["font-download", "ssip"]
# The font store's language-pack downloader. The KatWork build turns it off (`--no-default-features`).
font-download = ["wordcraft-engine/font-download", "wordcraft-mcp/font-download", "wordcraft-zotero/font-download"]
# Read Aloud's Speech Dispatcher client. The KatWork build turns it off too.
ssip = ["wordcraft-engine/ssip", "wordcraft-mcp/ssip", "wordcraft-zotero/ssip"]

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"

[dev-dependencies]
wordcraft-fonts = { workspace = true }
wordcraft-geom = { workspace = true, features = ["image"] }
image = { workspace = true }
craft-zip = { workspace = true }
